<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AEROSEEK</title>
    <meta name="description" content="AEROSEEK" />
    <style>
      :root {
        --bg0: #0a0c10;
        --bg1: #13161d;
        --card: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.66);
        --accent: #cfd3dc;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: radial-gradient(1100px 760px at 10% 12%, #1c2230 0%, rgba(28, 34, 48, 0) 55%),
          radial-gradient(900px 650px at 78% 22%, #1a1f2b 0%, rgba(26, 31, 43, 0) 55%),
          linear-gradient(180deg, var(--bg1), var(--bg0));
      }

      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1040px, calc(100% - 28px));
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(10px);
        background: rgba(10, 12, 16, 0.78);
        border-bottom: 1px solid var(--border);
      }

      .topbarInner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: calc(10px + env(safe-area-inset-top)) 0 10px;
      }

      .leftGroup {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .langBtn {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1;
      }

      .langBtn:active {
        transform: translateY(1px);
      }

      .brand {
        font-weight: 720;
        letter-spacing: 0.6px;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 3.5vw, 38px);
        line-height: 1.15;
      }

      .sub {
        margin-top: 10px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        max-width: 58ch;
      }

      .main {
        flex: 1;
        display: flex;
        align-items: center;
        padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
        min-height: 0;
      }

      .panel {
        width: 100%;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        border-radius: 18px;
        padding: 16px;
      }

      .features {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .pill {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        font-size: 13px;
        color: var(--muted);
      }

      .pill b {
        color: rgba(255, 255, 255, 0.9);
        font-weight: 650;
      }

      .downloadBar {
        margin-top: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        border-radius: 18px;
      }

      .downloadMeta {
        line-height: 1.55;
      }

      .downloadTitle {
        font-weight: 650;
        font-size: 14px;
      }

      .downloadHint {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid rgba(207, 211, 220, 0.35);
        background: rgba(207, 211, 220, 0.12);
        color: var(--text);
        font-size: 14px;
        font-weight: 650;
        white-space: nowrap;
      }

      .btn:hover {
        background: rgba(207, 211, 220, 0.16);
      }

      .btnRow {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .legal {
        margin-top: 12px;
        color: rgba(255, 255, 255, 0.46);
        font-size: 12px;
      }

      @media (max-width: 860px) {
        .downloadBar {
          flex-direction: column;
          align-items: stretch;
        }
        .btnRow {
          flex-direction: column;
          align-items: stretch;
        }
        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container topbarInner">
        <div class="leftGroup">
          <button class="langBtn" id="langBtn" type="button">EN</button>
          <div class="brand">AEROSEEK</div>
        </div>
      </div>
    </header>

    <main class="container main">
      <section class="panel">
        <h1 data-i18n="heroTitle">低空安全与反无人机</h1>
        <div class="sub" data-i18n="heroSub">
          面向园区、场馆与重点区域的低空安全能力建设。
        </div>

        <div class="features">
          <div class="pill"><b data-i18n="c1t">探测</b><span data-i18n="c1d">发现并跟踪可疑目标。</span></div>
          <div class="pill"><b data-i18n="c2t">识别</b><span data-i18n="c2d">分类研判，降低误报。</span></div>
          <div class="pill"><b data-i18n="c3t">处置</b><span data-i18n="c3d">策略联动，形成闭环。</span></div>
        </div>
        <div class="downloadBar">
          <div class="downloadMeta">
            <div class="downloadTitle" data-i18n="dlTitle">产品资料（PDF）</div>
            <div class="downloadHint" data-i18n="dlHint">打开或下载产品资料</div>
          </div>
          <div class="btnRow">
            <a class="btn" id="pdfOpenBtn" href="catalog.pdf" target="_blank" rel="noreferrer" data-i18n="dlOpen"
              >打开</a
            >
            <a class="btn" id="pdfDownloadBtn" href="catalog.pdf" target="_blank" rel="noreferrer" data-i18n="dlDownload"
              >下载</a
            >
          </div>
        </div>
        <div class="legal">© AEROSEEK</div>
      </section>
    </main>

    <script>
      (function () {
        var STRINGS = {
          "zh-CN": {
            heroTitle: "低空安全与反无人机",
            heroSub: "面向园区、场馆与重点区域的低空安全能力建设。",
            c1t: "探测",
            c1d: "发现并跟踪可疑目标。",
            c2t: "识别",
            c2d: "分类研判，降低误报。",
            c3t: "处置",
            c3d: "策略联动，形成闭环。",
            dlTitle: "产品资料（PDF）",
            dlHint: "打开或下载产品资料",
            dlOpen: "打开",
            dlDownload: "下载",
          },
          en: {
            heroTitle: "Low-Altitude Security & Counter-UAS",
            heroSub: "Security for campuses, venues, and critical sites.",
            c1t: "Detect",
            c1d: "Find and track targets.",
            c2t: "Identify",
            c2d: "Classify with lower false alarms.",
            c3t: "Respond",
            c3d: "Policy-driven actions and linkage.",
            dlTitle: "Product PDF",
            dlHint: "Open or download the catalog",
            dlOpen: "Open",
            dlDownload: "Download",
          },
        };

        var PDF_FILES = {
          "zh-CN": "中文Aeroseek Catalog.pdf",
          en: "英文Aeroseek Catalog.pdf",
        };

        function getPdfUrl(lang) {
          var file = PDF_FILES[lang] || PDF_FILES["zh-CN"];
          try {
            return encodeURI(file);
          } catch (e) {
            return file;
          }
        }

        function setLang(lang) {
          var dict = STRINGS[lang] || STRINGS["zh-CN"];
          document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
          try {
            localStorage.setItem("lang", lang);
          } catch (e) {}

          var nodes = document.querySelectorAll("[data-i18n]");
          for (var i = 0; i < nodes.length; i += 1) {
            var key = nodes[i].getAttribute("data-i18n");
            if (dict[key]) nodes[i].textContent = dict[key];
          }

          var btn = document.getElementById("langBtn");
          if (btn) btn.textContent = lang === "en" ? "中文" : "EN";

          var openBtn = document.getElementById("pdfOpenBtn");
          var downloadBtn = document.getElementById("pdfDownloadBtn");
          var pdfUrl = getPdfUrl(lang);
          if (openBtn) openBtn.setAttribute("href", pdfUrl);
          if (downloadBtn) {
            downloadBtn.setAttribute("href", pdfUrl);
            downloadBtn.setAttribute(
              "download",
              lang === "en" ? "AEROSEEK-Catalog-EN.pdf" : "AEROSEEK-Catalog-CN.pdf"
            );
          }
        }

        function getInitLang() {
          try {
            var saved = localStorage.getItem("lang");
            if (saved === "en" || saved === "zh-CN") return saved;
          } catch (e) {}
          var navLang = (navigator.language || "").toLowerCase();
          return navLang.indexOf("zh") === 0 ? "zh-CN" : "en";
        }

        var langBtn = document.getElementById("langBtn");
        var current = getInitLang();
        setLang(current);

        if (langBtn) {
          langBtn.addEventListener("click", function () {
            current = current === "en" ? "zh-CN" : "en";
            setLang(current);
          });
        }

        function openOrNavigate(url) {
          var opened = null;
          try {
            opened = window.open(url, "_blank");
          } catch (err) {}
          if (!opened) {
            try {
              window.location.href = url;
            } catch (err2) {}
          }
        }

        var pdfOpenBtn = document.getElementById("pdfOpenBtn");
        if (pdfOpenBtn) {
          pdfOpenBtn.addEventListener("click", function (e) {
            e.preventDefault();
            openOrNavigate(pdfOpenBtn.getAttribute("href") || "catalog.pdf");
          });
        }

        var pdfDownloadBtn = document.getElementById("pdfDownloadBtn");
        if (pdfDownloadBtn) {
          pdfDownloadBtn.addEventListener("click", function (e) {
            e.preventDefault();
            openOrNavigate(pdfDownloadBtn.getAttribute("href") || "catalog.pdf");
          });
        }
      })();
    </script>
  </body>
</html>
