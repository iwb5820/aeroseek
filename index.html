<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AEROSEEK</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #f6f7f9;
      }
      .viewer {
        flex: 1;
        overflow: auto;
        padding: 12px 10px 18px;
      }
      .page {
        display: block;
        margin: 0 auto 12px;
        max-width: 100%;
        background: #ffffff;
        box-shadow: 0 4px 22px rgba(0, 0, 0, 0.08);
        border-radius: 6px;
      }
      canvas.page {
        height: auto;
        width: 100%;
        max-width: 980px;
      }
      .fallback {
        padding: 16px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        line-height: 1.5;
      }
      .fallback a {
        word-break: break-all;
      }
      .loading {
        display: flex;
        justify-content: center;
        padding: 18px 0 10px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        font-size: 14px;
        color: #4b5563;
      }
      .hidden {
        display: none;
      }
      .notice {
        margin-top: 10px;
        color: #6b7280;
        font-size: 13px;
      }
      .btnLink {
        display: inline-block;
        margin-top: 10px;
      }
      .btnLink a {
        word-break: break-all;
      }
      .pageImg {
        display: block;
        margin: 0 auto 12px;
        max-width: 980px;
        width: 100%;
        height: auto;
        background: #ffffff;
        box-shadow: 0 4px 22px rgba(0, 0, 0, 0.08);
        border-radius: 6px;
      }
      canvas {
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="viewer" id="viewer">
        <div class="loading" id="loading">正在加载…</div>
        <div id="pages"></div>
      </div>

      <div class="fallback hidden" id="fallback">
        <div id="fallbackText">当前环境无法预览，请打开原文件查看。</div>
        <div class="btnLink">
          <a id="open" href="catalog.pdf" target="_blank" rel="noreferrer">打开原文件</a>
        </div>
        <div class="notice">
          如果在微信里预览失败，通常是内核限制/性能不足。直接打开原文件一般能看。
        </div>
      </div>
    </div>

    <script>
      (function () {
        if (typeof globalThis !== "undefined") return;
        if (typeof window !== "undefined") {
          window.globalThis = window;
          return;
        }
        if (typeof self !== "undefined") {
          self.globalThis = self;
        }
      })();
    </script>
    <script>
      (function () {
        var pdfUrl = "catalog.pdf";
        var viewer = document.getElementById("viewer");
        var fallback = document.getElementById("fallback");
        var fallbackText = document.getElementById("fallbackText");
        var loading = document.getElementById("loading");
        var pagesEl = document.getElementById("pages");
        var openLink = document.getElementById("open");

        if (openLink) openLink.href = pdfUrl;

        function isWeChat() {
          var ua = navigator.userAgent || "";
          return /MicroMessenger/i.test(ua);
        }

        function supportsModernJs() {
          try {
            new Function("()=>{}");
            return true;
          } catch (e) {
            return false;
          }
        }

        function showFallback(message) {
          viewer.classList.add("hidden");
          fallback.classList.remove("hidden");
          if (fallbackText) {
            fallbackText.textContent = message || "当前环境不支持直接预览。";
          }
          if (loading) loading.classList.add("hidden");
        }

        var watchdogTimer = null;
        var loadingTask = null;
        var renderStarted = false;

        function startWatchdog() {
          if (watchdogTimer) return;
          watchdogTimer = setTimeout(function () {
            if (!renderStarted) {
              showFallback("预览加载超时（文件较大/微信内核限制），建议直接打开原文件。");
            }
          }, 45000);
        }

        function setLoadingText(text) {
          if (loading) loading.textContent = text;
        }

        function clearPages() {
          while (pagesEl.firstChild) pagesEl.removeChild(pagesEl.firstChild);
        }

        function renderAllPagesEager(doc) {
          renderStarted = true;
          clearPages();
          if (loading) loading.classList.remove("hidden");

          var targetCssWidth = Math.min(980, Math.max(320, viewer.clientWidth - 20));
          var dpr = Math.min(window.devicePixelRatio || 1, 1.5);

          var chain = Promise.resolve();
          for (var pageNum = 1; pageNum <= doc.numPages; pageNum += 1) {
            (function (n) {
              chain = chain.then(function () {
                return doc.getPage(n).then(function (page) {
                  var viewport = page.getViewport({ scale: 1 });
                  var cssScale = targetCssWidth / viewport.width;
                  var scaledViewport = page.getViewport({ scale: cssScale });

                  var canvas = document.createElement("canvas");
                  canvas.className = "page";
                  canvas.style.width = Math.floor(scaledViewport.width) + "px";
                  canvas.style.height = Math.floor(scaledViewport.height) + "px";
                  canvas.width = Math.floor(scaledViewport.width * dpr);
                  canvas.height = Math.floor(scaledViewport.height * dpr);
                  pagesEl.appendChild(canvas);

                  var ctx = canvas.getContext("2d");
                  var transform = dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null;

                  setLoadingText("正在渲染… " + n + " / " + doc.numPages);
                  return page.render({
                    canvasContext: ctx,
                    viewport: scaledViewport,
                    transform: transform,
                  }).promise;
                });
              });
            })(pageNum);
          }

          return chain.then(function () {
            if (loading) loading.classList.add("hidden");
            setLoadingText("下滑查看");
          });
        }

        function renderAllPagesLazy(doc) {
          renderStarted = true;
          clearPages();
          if (loading) loading.classList.remove("hidden");

          var targetCssWidth = Math.min(980, Math.max(320, viewer.clientWidth - 20));
          var dpr = Math.min(window.devicePixelRatio || 1, 1.5);

          var totalPages = doc.numPages;
          var renderedCount = 0;
          var renderedMap = Object.create(null);
          var queuedMap = Object.create(null);
          var renderQueue = [];
          var rendering = false;
          var pageRatio = 1.414;
          var placeholderHeight = Math.floor(targetCssWidth * pageRatio);

          setLoadingText("正在渲染… 0 / " + totalPages);

          function updateLoadingText() {
            if (!loading) return;
            if (renderedCount >= totalPages) {
              loading.classList.add("hidden");
              return;
            }
            setLoadingText("边看边加载… " + renderedCount + " / " + totalPages);
          }

          function updatePlaceholdersHeight(height) {
            placeholderHeight = height;
            var children = pagesEl.children;
            for (var i = 0; i < children.length; i += 1) {
              var el = children[i];
              if (el && el.style && !el.getAttribute("data-rendered")) {
                el.style.height = placeholderHeight + "px";
              }
            }
          }

          function createCanvas(pageNum) {
            var canvas = document.createElement("canvas");
            canvas.className = "page";
            canvas.setAttribute("data-page-number", String(pageNum));
            canvas.style.width = targetCssWidth + "px";
            canvas.style.height = placeholderHeight + "px";
            return canvas;
          }

          function renderPageToCanvas(pageNum, canvas) {
            return doc.getPage(pageNum).then(function (page) {
              var viewport = page.getViewport({ scale: 1 });
              if (viewport && viewport.width && viewport.height) {
                var nextRatio = viewport.height / viewport.width;
                if (nextRatio > 0.1 && nextRatio < 10 && Math.abs(nextRatio - pageRatio) > 0.01) {
                  pageRatio = nextRatio;
                  updatePlaceholdersHeight(Math.floor(targetCssWidth * pageRatio));
                }
              }

              var cssScale = targetCssWidth / viewport.width;
              var scaledViewport = page.getViewport({ scale: cssScale });

              canvas.style.width = Math.floor(scaledViewport.width) + "px";
              canvas.style.height = Math.floor(scaledViewport.height) + "px";
              canvas.width = Math.floor(scaledViewport.width * dpr);
              canvas.height = Math.floor(scaledViewport.height * dpr);

              var ctx = canvas.getContext("2d");
              var transform = dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null;

              return page.render({
                canvasContext: ctx,
                viewport: scaledViewport,
                transform: transform,
              }).promise;
            });
          }

          function enqueue(canvas) {
            var pageNum = parseInt(canvas.getAttribute("data-page-number") || "0", 10);
            if (!pageNum) return;
            if (renderedMap[pageNum]) return;
            if (queuedMap[pageNum]) return;
            queuedMap[pageNum] = true;
            renderQueue.push(canvas);
          }

          function processQueue() {
            if (rendering) return;
            if (!renderQueue.length) return;

            var canvas = renderQueue.shift();
            if (!canvas) return;

            var pageNum = parseInt(canvas.getAttribute("data-page-number") || "0", 10);
            if (!pageNum) return;
            if (renderedMap[pageNum]) return;

            rendering = true;

            renderPageToCanvas(pageNum, canvas)
              .then(function () {
                renderedMap[pageNum] = true;
                canvas.setAttribute("data-rendered", "1");
                renderedCount += 1;
                updateLoadingText();
              })
              .catch(function () {
                showFallback("预览加载失败，建议直接打开原文件。");
              })
              .then(function () {
                rendering = false;
                processQueue();
              });
          }

          for (var n = 1; n <= totalPages; n += 1) {
            pagesEl.appendChild(createCanvas(n));
          }

          if (!("IntersectionObserver" in window)) {
            return renderAllPagesEager(doc);
          }

          var observer = new IntersectionObserver(
            function (entries) {
              for (var i = 0; i < entries.length; i += 1) {
                var entry = entries[i];
                if (entry && entry.isIntersecting && entry.target) {
                  observer.unobserve(entry.target);
                  enqueue(entry.target);
                }
              }
              processQueue();
            },
            { root: viewer, rootMargin: "900px 0px", threshold: 0.01 }
          );

          var children = pagesEl.children;
          for (var i2 = 0; i2 < children.length; i2 += 1) {
            observer.observe(children[i2]);
          }

          if (children[0]) enqueue(children[0]);
          if (children[1]) enqueue(children[1]);
          processQueue();
        }

        function loadPdfJs(callback) {
          var script = document.createElement("script");
          script.src = "vendor/pdfjs/pdf.min.js";
          script.async = true;
          script.onload = function () {
            callback();
          };
          script.onerror = function () {
            showFallback("预览组件加载失败（pdf.js 加载失败），建议直接打开原文件。");
          };
          document.head.appendChild(script);
        }

        function initWorker() {
          try {
            if (!window.pdfjsLib) {
              showFallback("预览组件加载失败（pdf.js 未加载）。");
              return;
            }

            startWatchdog();
            window.pdfjsLib.GlobalWorkerOptions.workerSrc =
              "vendor/pdfjs/pdf.worker.min.js";

            setLoadingText("正在加载…");
            loadingTask = window.pdfjsLib.getDocument({ url: pdfUrl });
            loadingTask.onProgress = function (p) {
              if (!p || !p.total) return;
              var percent = Math.floor((p.loaded / p.total) * 100);
              if (percent < 0) percent = 0;
              if (percent > 99) percent = 99;
              setLoadingText("正在加载… " + percent + "%");
            };

            loadingTask.promise
              .then(function (doc) {
                return renderAllPagesLazy(doc);
              })
              .catch(function () {
                initNoWorker();
              });
          } catch (e) {
            initNoWorker();
          }
        }

        function initNoWorker() {
          try {
            setLoadingText("正在加载（兼容模式）…");

            window.pdfjsLib
              .getDocument({ url: pdfUrl, disableWorker: true })
              .promise.then(function (doc) {
                return renderAllPagesLazy(doc);
              })
              .catch(function () {
                showFallback("预览加载失败（微信内核限制），建议直接打开原文件。");
              });
          } catch (e) {
            showFallback("预览初始化失败（微信内核限制），建议直接打开原文件。");
          }
        }

        window.addEventListener("error", function () {
          showFallback("预览运行出错，建议直接打开原文件。");
        });

        window.addEventListener("unhandledrejection", function () {
          showFallback("预览运行出错，建议直接打开原文件。");
        });

        if (isWeChat()) {
          if (openLink) openLink.target = "_self";
          setLoadingText("检测到微信，正在打开原文件…");
          showFallback("微信内置浏览器对 pdf.js 兼容性不稳定，建议直接打开原文件查看。");
          setTimeout(function () {
            try {
              window.location.href = pdfUrl;
            } catch (e) {}
          }, 200);
          return;
        }

        if (!supportsModernJs()) {
          openLink.target = "_self";
          showFallback("当前浏览器版本较低，建议直接打开原文件查看。");
          return;
        }

        loadPdfJs(function () {
          initWorker();
        });
      })();
    </script>
  </body>
</html>
