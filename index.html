<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AEROSEEK</title>
    <meta name="description" content="AEROSEEK 低空安全与反无人机解决方案。" />
    <style>
      :root {
        --bg: #0b1020;
        --card: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.7);
        --brand: #6ee7ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 800px at 15% 10%, #16306a 0%, rgba(22, 48, 106, 0) 55%),
          radial-gradient(900px 700px at 80% 30%, #0b6a7a 0%, rgba(11, 106, 122, 0) 55%),
          var(--bg);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(10px);
        background: rgba(11, 16, 32, 0.72);
        border-bottom: 1px solid var(--border);
      }

      .headerInner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .badge {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--brand);
        box-shadow: 0 0 0 6px rgba(110, 231, 255, 0.12);
      }

      .nav {
        display: flex;
        gap: 16px;
        font-size: 14px;
        color: var(--muted);
      }

      .nav a:hover {
        color: var(--text);
      }

      .hero {
        padding: 52px 0 20px;
      }

      .heroGrid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 18px;
        align-items: stretch;
      }

      .heroCard {
        padding: 22px;
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 3.6vw, 42px);
        line-height: 1.15;
      }

      .subtitle {
        margin-top: 12px;
        font-size: 15px;
        line-height: 1.7;
        color: var(--muted);
      }

      .kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 18px;
      }

      .kpi {
        padding: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        border-radius: 12px;
      }

      .kpiLabel {
        font-size: 12px;
        color: var(--muted);
      }

      .kpiValue {
        margin-top: 6px;
        font-size: 16px;
        font-weight: 650;
      }

      .cards {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .card {
        padding: 16px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        border-radius: 14px;
        color: var(--muted);
        line-height: 1.6;
        font-size: 14px;
      }

      .cardTitle {
        color: var(--text);
        font-weight: 650;
        margin-bottom: 6px;
      }

      .download {
        padding: 26px 0 56px;
      }

      .downloadInner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        border-radius: 16px;
      }

      .downloadText {
        line-height: 1.6;
      }

      .downloadTitle {
        font-weight: 650;
      }

      .downloadSub {
        color: var(--muted);
        font-size: 14px;
        margin-top: 6px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(110, 231, 255, 0.4);
        background: rgba(110, 231, 255, 0.14);
        color: var(--text);
        font-size: 14px;
        font-weight: 650;
        white-space: nowrap;
      }

      .btn:hover {
        background: rgba(110, 231, 255, 0.2);
      }

      .footer {
        padding: 18px 0 28px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
        border-top: 1px solid var(--border);
      }

      @media (max-width: 860px) {
        .heroGrid {
          grid-template-columns: 1fr;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        .kpis {
          grid-template-columns: 1fr;
        }
        .downloadInner {
          flex-direction: column;
          align-items: stretch;
        }
        .btn {
          width: 100%;
        }
        .nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container headerInner">
        <div class="brand"><span class="badge"></span><span>AEROSEEK</span></div>
        <nav class="nav">
          <a href="#solutions">解决方案</a>
          <a href="#download">资料下载</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero" id="solutions">
        <div class="heroGrid">
          <div class="heroCard">
            <h1>低空安全与反无人机解决方案</h1>
            <div class="subtitle">
              AEROSEEK 致力于提供面向园区、场馆、关键基础设施等场景的低空安全能力建设，
              支持探测、识别、定位、处置与联动管理。
            </div>
            <div class="kpis">
              <div class="kpi">
                <div class="kpiLabel">应用场景</div>
                <div class="kpiValue">园区 / 场馆 / 重要区域</div>
              </div>
              <div class="kpi">
                <div class="kpiLabel">能力链路</div>
                <div class="kpiValue">探测 · 识别 · 处置</div>
              </div>
              <div class="kpi">
                <div class="kpiLabel">交付方式</div>
                <div class="kpiValue">设备 + 平台 + 方案</div>
              </div>
            </div>
          </div>

          <div class="heroCard">
            <div class="cardTitle">我们能做什么</div>
            <div class="cards">
              <div class="card">
                <div class="cardTitle">低空监测</div>
                多源融合监测，帮助快速发现可疑目标并持续跟踪。
              </div>
              <div class="card">
                <div class="cardTitle">风险处置</div>
                按策略分级处置，支持与安防系统联动，形成闭环管理。
              </div>
              <div class="card">
                <div class="cardTitle">方案落地</div>
                从现场评估到部署调试，提供交付与运维支持。
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="download" id="download">
        <div class="downloadInner">
          <div class="downloadText">
            <div class="downloadTitle">产品资料（PDF）</div>
            <div class="downloadSub">点击按钮下载 catalog.pdf</div>
          </div>
          <a class="btn" href="catalog.pdf" download="AEROSEEK-catalog.pdf" rel="noreferrer"
            >下载 PDF</a
          >
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">© AEROSEEK</div>
    </footer>
  </body>
</html>
