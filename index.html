<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF 预览</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #f6f7f9;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        background: #ffffff;
        border-bottom: 1px solid #e6e8eb;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .toolbar button,
      .toolbar a {
        appearance: none;
        border: 1px solid #d8dce2;
        background: #fff;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
        color: #111827;
        text-decoration: none;
        line-height: 1;
      }
      .toolbar button:disabled {
        opacity: 0.5;
      }
      .spacer {
        flex: 1;
      }
      .status {
        font-size: 13px;
        color: #4b5563;
      }
      .viewer {
        flex: 1;
        overflow: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 12px;
      }
      canvas {
        background: #ffffff;
        box-shadow: 0 4px 22px rgba(0, 0, 0, 0.08);
        max-width: 100%;
        height: auto;
      }
      .fallback {
        padding: 16px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        line-height: 1.5;
      }
      a {
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="toolbar" id="toolbar" hidden>
        <button id="prev" type="button">上一页</button>
        <button id="next" type="button">下一页</button>
        <button id="zoomOut" type="button">缩小</button>
        <button id="zoomIn" type="button">放大</button>
        <span class="status" id="status">加载中…</span>
        <div class="spacer"></div>
        <a id="open" href="catalog.pdf" target="_blank" rel="noreferrer"
          >打开原文件</a
        >
      </div>

      <div class="viewer" id="viewer" hidden>
        <canvas id="canvas"></canvas>
      </div>

      <div class="fallback" id="fallback">
        <div id="fallbackText">正在加载预览组件…</div>
        <div>
          请点击打开：
          <a href="catalog.pdf" target="_blank" rel="noreferrer">catalog.pdf</a
          >
        </div>
      </div>
    </div>

    <script>
      (function () {
        if (typeof globalThis !== "undefined") return;
        if (typeof window !== "undefined") {
          window.globalThis = window;
          return;
        }
        if (typeof self !== "undefined") {
          self.globalThis = self;
        }
      })();
    </script>
    <script src="vendor/pdfjs/pdf.min.js"></script>
    <script>
      (function () {
        var pdfUrl = "catalog.pdf";
        var toolbar = document.getElementById("toolbar");
        var viewer = document.getElementById("viewer");
        var fallback = document.getElementById("fallback");
        var fallbackText = document.getElementById("fallbackText");
        var canvas = document.getElementById("canvas");
        var statusEl = document.getElementById("status");
        var prevBtn = document.getElementById("prev");
        var nextBtn = document.getElementById("next");
        var zoomOutBtn = document.getElementById("zoomOut");
        var zoomInBtn = document.getElementById("zoomIn");
        var openLink = document.getElementById("open");

        openLink.href = pdfUrl;

        function showFallback(message) {
          toolbar.hidden = true;
          viewer.hidden = true;
          fallback.hidden = false;
          if (fallbackText) {
            fallbackText.textContent = message || "当前环境不支持直接预览。";
          }
        }

        function showViewer() {
          toolbar.hidden = false;
          viewer.hidden = false;
          fallback.hidden = true;
        }

        var pdfDoc = null;
        var pageNum = 1;
        var scale = 1.2;
        var rendering = false;
        var pendingPage = null;
        var renderStarted = false;
        var watchdogTimer = null;
        var loadingTask = null;

        function setStatus(text) {
          statusEl.textContent = text;
        }

        function updateButtons() {
          prevBtn.disabled = !pdfDoc || pageNum <= 1 || rendering;
          nextBtn.disabled = !pdfDoc || pageNum >= pdfDoc.numPages || rendering;
          zoomOutBtn.disabled = !pdfDoc || rendering || scale <= 0.6;
          zoomInBtn.disabled = !pdfDoc || rendering || scale >= 3.0;
        }

        function queueRenderPage(num) {
          if (rendering) {
            pendingPage = num;
            return;
          }
          renderPage(num);
        }

        function renderPage(num) {
          rendering = true;
          pendingPage = null;
          updateButtons();
          setStatus("第 " + num + " / " + pdfDoc.numPages + " 页");

          pdfDoc
            .getPage(num)
            .then(function (page) {
              var viewport = page.getViewport({ scale: scale });
              var context = canvas.getContext("2d");
              canvas.width = Math.floor(viewport.width);
              canvas.height = Math.floor(viewport.height);

              var renderTask = page.render({
                canvasContext: context,
                viewport: viewport,
              });

              return renderTask.promise;
            })
            .then(function () {
              rendering = false;
              updateButtons();
              if (pendingPage !== null) {
                var next = pendingPage;
                pendingPage = null;
                renderPage(next);
              }
            })
            .catch(function () {
              showFallback();
            });
        }

        function onPrevPage() {
          if (!pdfDoc || pageNum <= 1) return;
          pageNum -= 1;
          queueRenderPage(pageNum);
        }

        function onNextPage() {
          if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
          pageNum += 1;
          queueRenderPage(pageNum);
        }

        function zoom(delta) {
          if (!pdfDoc) return;
          var nextScale = Math.max(0.6, Math.min(3.0, scale + delta));
          if (nextScale === scale) return;
          scale = nextScale;
          queueRenderPage(pageNum);
        }

        prevBtn.addEventListener("click", onPrevPage);
        nextBtn.addEventListener("click", onNextPage);
        zoomOutBtn.addEventListener("click", function () {
          zoom(-0.2);
        });
        zoomInBtn.addEventListener("click", function () {
          zoom(0.2);
        });

        function startWatchdog() {
          if (watchdogTimer) return;
          watchdogTimer = setTimeout(function () {
            if (!renderStarted) {
              showFallback("预览加载较慢（文件较大/微信内核限制），建议直接打开原文件。");
            }
          }, 20000);
        }

        function initWorker() {
          try {
            if (!window.pdfjsLib) {
              showFallback("预览组件加载失败（pdf.js 未加载）。");
              return;
            }

            startWatchdog();
            showViewer();
            updateButtons();

            window.pdfjsLib.GlobalWorkerOptions.workerSrc =
              "vendor/pdfjs/pdf.worker.min.js";

            setStatus("正在加载…");

            loadingTask = window.pdfjsLib.getDocument({ url: pdfUrl });
            loadingTask.onProgress = function (p) {
              if (!p || !p.total) return;
              var percent = Math.floor((p.loaded / p.total) * 100);
              if (percent < 0) percent = 0;
              if (percent > 99) percent = 99;
              setStatus("正在加载… " + percent + "%");
            };

            loadingTask.promise
              .then(function (doc) {
                pdfDoc = doc;
                pageNum = 1;
                setStatus("第 " + pageNum + " / " + pdfDoc.numPages + " 页");
                renderStarted = true;
                renderPage(pageNum);
              })
              .catch(function () {
                initNoWorker();
              });
          } catch (e) {
            initNoWorker();
          }
        }

        function initNoWorker() {
          try {
            setStatus("正在加载（兼容模式）…");

            window.pdfjsLib
              .getDocument({ url: pdfUrl, disableWorker: true })
              .promise.then(function (doc) {
                pdfDoc = doc;
                pageNum = 1;
                setStatus("第 " + pageNum + " / " + pdfDoc.numPages + " 页");
                renderStarted = true;
                renderPage(pageNum);
              })
              .catch(function () {
                showFallback("预览加载失败（微信内核限制），建议直接打开原文件。");
              });
          } catch (e) {
            showFallback("预览初始化失败（微信内核限制），建议直接打开原文件。");
          }
        }

        window.addEventListener("error", function () {
          showFallback("预览运行出错，建议直接打开原文件。");
        });

        window.addEventListener("unhandledrejection", function () {
          showFallback("预览运行出错，建议直接打开原文件。");
        });

        initWorker();
      })();
    </script>
  </body>
</html>
